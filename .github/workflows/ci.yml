name: CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

#    strategy:
#      matrix:
#        java: [1.8, 11, 12]

    steps:
    - uses: actions/checkout@v1
    - name: Set up JDK
      uses: actions/setup-java@v1
      with:
        java-version: 1.8
    - name: start tarantool
      run: docker run -d -p 3301:3301 -e TARANTOOL_USER_NAME=admin -e TARANTOOL_USER_PASSWORD=javapass tarantool/tarantool:2
    - name: Build
      run: ./mvnw clean verify
